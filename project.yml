name: Geumgogom
options:
  bundleIdPrefix: com.tonyne
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  Geumgogom:
    type: application
    platform: iOS
    sources:
      - path: Sources
    scheme:
      testTargets: []
      storeKitConfiguration: Geumgogom.storekit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tonyne.geumgogom
        PRODUCT_NAME: Geumgogom
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 금고곰
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSFaceIDUsageDescription: "저장한 정보를 열어볼 때 본인 확인에 사용합니다."
        INFOPLIST_KEY_NSCameraUsageDescription: "카드·통장 등을 촬영해 번호를 읽어오는 데 사용합니다. 사진은 저장하지 않습니다."
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: Sources/Geumgogom.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
